regex = { version = "1.7.0", default-features = false, features = ["std", "unicode", "perf"] }
regex-syntax = { version = "0.8.0", default-features = false, features = ["unicode"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
memchr = "2.7.4"

[lints]
workspace = true
