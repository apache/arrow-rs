[package]
name = "arrow-data"
version = { workspace = true }
description = "Array data abstractions for Apache Arrow"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_data"
bench = false

[features]
# force_validate runs full data validation for all arrays that are created
# this is not enabled by default as it is too computationally expensive
# but is run as part of our CI checks
force_validate = []
# Enable ffi support
ffi = ["arrow-schema/ffi"]
# Enable memory tracking support
pool = ["arrow-buffer/pool"]

[package.metadata.docs.rs]
all-features = true

[dependencies]

arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }

num-integer = { version = "0.1.46", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
half = { version = "2.1", default-features = false }

[dev-dependencies]

[build-dependencies]

[lints]
workspace = true
