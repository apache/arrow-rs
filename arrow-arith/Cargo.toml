[package]
name = "arrow-arith"
version = { workspace = true }
description = "Arrow arithmetic kernels"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_arith"
bench = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }

[[bench]]
name = "decimal_arithmetic"
harness = false

[[bench]]
name = "temporal"
harness = false

[[bench]]
name = "integer_division"
harness = false

[[bench]]
name = "decimal_division"
harness = false

[lints]
workspace = true
