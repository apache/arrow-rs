# workspace wide tests
name: rust

# Triggered by ci.yml, which owns event routing and concurrency.
on:
  workflow_call:
    inputs:
      lint-only:
        description: Run only formatting and unused dependency checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Check workspace wide compile and test with default features for macOS.
  # Fork macOS runners frequently time out, so keep this testing upstream.
  macos:
    if: ${{ !inputs.lint-only && github.repository == 'apache/arrow-rs' }}
    name: Test on Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install protoc with brew
        run: brew install protobuf
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
      - name: Run tests
        shell: bash
        run: |
          # do not produce debug symbols to keep memory usage down
          export RUSTFLAGS="-C debuginfo=0"
          # PyArrow tests happen in integration.yml.
          cargo test --workspace

  # Check workspace wide compile and test with default features for Windows.
  # Keep this testing upstream to reduce compute in forks.
  windows:
    if: ${{ !inputs.lint-only && github.repository == 'apache/arrow-rs' }}
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install protobuf compiler in /d/protoc
        shell: bash
        run: |
          mkdir /d/protoc
          cd /d/protoc
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v21.4/protoc-21.4-win64.zip
          unzip protoc-21.4-win64.zip
          export PATH=$PATH:/d/protoc/bin
          protoc --version

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
      - name: Run tests
        shell: bash
        run: |
          # do not produce debug symbols to keep memory usage down
          export RUSTFLAGS="-C debuginfo=0"
          export PATH=$PATH:/d/protoc/bin
          cargo test --workspace

  # Run cargo fmt for all crates
  lint:
    name: Lint (cargo fmt)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-rustup
      - name: Setup rustfmt
        run: rustup component add rustfmt
      - name: Format workspace
        run: cargo fmt --all -- --check

  unused-dependencies:
    name: Check unused dependencies
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-rustup
      - name: Install cargo-shear
        id: install-shear
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: cargo-shear
      - name: Check workspace dependencies
        run: cargo shear --deny-warnings
      - name: Check arrow-pyarrow-testing dependencies
        # Report excluded crates even when an earlier scan finds issues.
        if: ${{ !cancelled() && steps.install-shear.outcome == 'success' }}
        run: cargo shear --deny-warnings arrow-pyarrow-testing
      - name: Check arrow-pyarrow-integration-testing dependencies
        if: ${{ !cancelled() && steps.install-shear.outcome == 'success' }}
        run: cargo shear --deny-warnings arrow-pyarrow-integration-testing

  msrv:
    if: ${{ !inputs.lint-only }}
    name: Verify MSRV (Minimum Supported Rust Version)
    runs-on: ubuntu-latest
    container:
      image: amd64/rust@sha256:5b5938cbb2951fc2869eaf891a6616f722ef5bf28c90dc6a074c35c141e31537 # v1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder
      - name: Install cargo-msrv
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: cargo-msrv
      - name: Check all packages
        run: |
          # run `cargo msrv verify --manifest-path "path/to/Cargo.toml"` to see problematic dependencies
          find . -mindepth 2 -name Cargo.toml | while read -r dir
          do
            echo "Checking package '$dir'"
            cargo msrv verify --manifest-path "$dir" --output-format=json || exit 1
          done
