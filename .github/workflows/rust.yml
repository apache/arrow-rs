# workspace wide tests
name: rust

# Triggered by ci.yml, which owns event routing and concurrency.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Check workspace wide compile and test with default features for
  # mac
  macos:
    name: Test on Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - name: Install protoc with brew
        run: brew install protobuf
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
      - name: Run tests
        shell: bash
        run: |
          # do not produce debug symbols to keep memory usage down
          export RUSTFLAGS="-C debuginfo=0"
          # PyArrow tests happen in integration.yml.
          cargo test --workspace

  # Check workspace wide compile and test with default features for
  # windows
  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
      - name: Install protobuf compiler in /d/protoc
        shell: bash
        run: |
          mkdir /d/protoc
          cd /d/protoc
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v21.4/protoc-21.4-win64.zip
          unzip protoc-21.4-win64.zip
          export PATH=$PATH:/d/protoc/bin
          protoc --version

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
      - name: Run tests
        shell: bash
        run: |
          # do not produce debug symbols to keep memory usage down
          export RUSTFLAGS="-C debuginfo=0"
          export PATH=$PATH:/d/protoc/bin
          cargo test --workspace

  # Run cargo fmt for all crates
  lint:
    name: Lint (cargo fmt)
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - name: Setup rustfmt
        run: rustup component add rustfmt
      - name: Format workspace
        run: cargo fmt --all -- --check

  unused-dependencies:
    name: Check unused dependencies
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        run: rustup install
      - name: Install cargo-machete
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7  # v2.87.23
        with:
          tool: cargo-machete@0.9.2
      - name: Check unused dependencies
        run: cargo machete --with-metadata

  msrv:
    name: Verify MSRV (Minimum Supported Rust Version)
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - name: Install cargo-msrv
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7  # v2.87.23
        with:
          tool: cargo-msrv
      - name: Check all packages
        run: |
          # run `cargo msrv verify --manifest-path "path/to/Cargo.toml"` to see problematic dependencies
          find . -mindepth 2 -name Cargo.toml | while read -r dir
          do
            echo "Checking package '$dir'"
            cargo msrv verify --manifest-path "$dir" --output-format=json || exit 1
          done
