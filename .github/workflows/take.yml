name: Assign or unassign the issue via a `take`/`untake` comment
on:
  issue_comment:
    types: created

permissions:
  issues: write

jobs:
  issue_assign:
    if: (!github.event.issue.pull_request) && (github.event.comment.body == 'take' || github.event.comment.body == 'untake')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const method = context.payload.comment.body === 'take' ? 'addAssignees' : 'removeAssignees';
            github.rest.issues[method]({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.comment.user.login],
            })
