name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select and validate CI suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # PR routing uses the merge base, including changes from all commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CI configuration dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Validate CI configuration and routing
        run: python3 .github/ci/scripts/check-ci-config.py
      - name: Select suites
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/ci/scripts/compute-changes.py

  arrow:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'arrow')
    uses: ./.github/workflows/arrow.yml

  arrow-flight:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'arrow-flight')
    uses: ./.github/workflows/arrow_flight.yml

  parquet:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'parquet')
    uses: ./.github/workflows/parquet.yml

  parquet-derive:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'parquet-derive')
    uses: ./.github/workflows/parquet_derive.yml

  parquet-geospatial:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'parquet-geospatial')
    uses: ./.github/workflows/parquet-geospatial.yml

  integration:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'integration')
    uses: ./.github/workflows/integration.yml

  audit:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'audit')
    uses: ./.github/workflows/audit.yml

  dev:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'dev')
    uses: ./.github/workflows/dev.yml

  rust:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'rust')
    uses: ./.github/workflows/rust.yml

  docs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'docs')
    # Only the deploy job in docs.yml requests write access, on push to main.
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml

  miri:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.suites), 'miri')
    uses: ./.github/workflows/miri.yaml

  required-checks:
    # Like datafusion-comet: one stable check name even when a reusable
    # workflow is skipped (its individual check names would be different).
    name: Required Checks
    if: always()
    permissions: {}
    needs:
      - changes
      - arrow
      - arrow-flight
      - parquet
      - parquet-derive
      - parquet-geospatial
      - integration
      - audit
      - dev
      - rust
      - docs
      - miri
    runs-on: ubuntu-slim
    steps:
      - name: Summarize suite results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
      # Path-filtered suites and Miri outside the queue are intentionally
      # skipped. A failed/cancelled selector or suite must still block merging.
      - name: Fail if any suite failed or was cancelled
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI suites did not succeed. See the results above."
          exit 1
