name: dev

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

# trigger for all PRs and changes to main
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rat:
    name: Release Audit Tool (RAT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.8
      - name: Audit licenses
        run: ./dev/release/run-rat.sh .

  prettier:
    name: Markdown format
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "14"
      - name: Prettier check
        run: |
          # if you encounter error, run the command below and commit the changes
          npx prettier@2.3.2 --write {arrow,arrow-flight,dev,arrow-integration-testing,parquet}/**/*.md README.md CODE_OF_CONDUCT.md CONTRIBUTING.md
          git diff --exit-code
  typos:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Version fixed on purpose. It uses heuristics to detect typos, so upgrading
      # it may cause checks to fail more often.
      # We can upgrade it manually once a while.
      - name: Install typos
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2.86.5
        with:
          tool: typos@1.37.0
      - name: Run typos check
        run: .github/ci/scripts/typos_check.sh
