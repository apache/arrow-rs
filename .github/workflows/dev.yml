name: dev

# Triggered by ci.yml, which owns event routing and concurrency.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  license-headers:
    name: License headers
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install HawkEye
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: hawkeye
      - name: Check license headers
        run: hawkeye check --fail-on-unknown

  prettier:
    name: Markdown format
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "14"
      - name: Prettier check
        run: |
          # if you encounter error, run the command below and commit the changes
          npx prettier@2.3.2 --write {arrow,arrow-flight,dev,arrow-integration-testing,parquet}/**/*.md README.md CODE_OF_CONDUCT.md CONTRIBUTING.md
          git diff --exit-code
  typos:
    name: Spell Check with Typos
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Version fixed on purpose. It uses heuristics to detect typos, so upgrading
        # it may cause checks to fail more often.
        # We can upgrade it manually once a while.
        with:
          persist-credentials: false
      - name: Install typos
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: typos@1.37.0
      - name: Run typos check
        run: .github/ci/scripts/typos_check.sh
