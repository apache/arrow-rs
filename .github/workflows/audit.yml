name: audit

# Triggered by ci.yml, which owns event routing and concurrency.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Audit
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: cargo-audit
      - name: Run audit check
        # ubuntu-slim has no Rust toolchain to dispatch `cargo audit`, so
        # call the binary directly.
        run: cargo-audit audit
