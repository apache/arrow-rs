name: audit

# Triggered by ci.yml, which owns event routing and concurrency.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Audit
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install cargo-audit
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
        with:
          tool: cargo-audit
      - name: Run audit check
        # ubuntu-slim has no Rust toolchain to dispatch `cargo audit`, so
        # call the binary directly.
        run: cargo-audit audit
