# Shared build inputs select all suites on pull requests.
common:
  - .asf.yaml
  - .github/**
  - .gitmodules
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
suites:
  arrow:
    - arrow-arith/**
    - arrow-array/**
    - arrow-buffer/**
    - arrow-cast/**
    - arrow-cmp/**
    - arrow-csv/**
    - arrow-data/**
    - arrow-integration-test/**
    - arrow-ipc/**
    - arrow-json/**
    - arrow-avro/**
    - arrow-ord/**
    - arrow-row/**
    - arrow-schema/**
    - arrow-select/**
    - arrow-string/**
    - arrow/**
  arrow-flight:
    - arrow-array/**
    - arrow-buffer/**
    - arrow-cast/**
    - arrow-data/**
    - arrow-flight/**
    - arrow-ipc/**
    - arrow-schema/**
    - arrow-select/**
  parquet:
    - testing
    - parquet-testing
    - arrow/**
    - arrow-arith/**
    - arrow-array/**
    - arrow-buffer/**
    - arrow-cast/**
    - arrow-cmp/**
    - arrow-csv/**
    - arrow-data/**
    - arrow-ipc/**
    - arrow-json/**
    - arrow-ord/**
    - arrow-row/**
    - arrow-schema/**
    - arrow-select/**
    - arrow-string/**
    - parquet/**
    - parquet-geospatial/**
    - parquet-variant/**
    - parquet-variant-compute/**
    - parquet-variant-json/**
  parquet-derive:
    - parquet/**
    - parquet_derive/**
    - parquet_derive_test/**
  parquet-geospatial:
    - parquet-geospatial/**
  integration:
    - arrow-arith/**
    - arrow-array/**
    - arrow-buffer/**
    - arrow-cast/**
    - arrow-cmp/**
    - arrow-csv/**
    - arrow-data/**
    - arrow-flight/**
    - arrow-integration-test/**
    - arrow-integration-testing/**
    - arrow-ipc/**
    - arrow-json/**
    - arrow-ord/**
    - arrow-pyarrow-integration-testing/**
    - arrow-pyarrow/**
    - arrow-row/**
    - arrow-schema/**
    - arrow-select/**
    - arrow-string/**
    - arrow/**
  audit:
    - '**/Cargo.toml'
    - '**/Cargo.lock'
