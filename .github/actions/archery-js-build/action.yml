name: Prepare Archery JavaScript build
description: Prepare JavaScript sources and dependencies for Archery
inputs:
  lookup-only:
    description: Seed missing caches without downloading existing builds
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify JavaScript build inputs
      id: inputs
      shell: bash
      run: |
        conda run --no-capture-output bash -euo pipefail <<'BASH'
        {
          git -c safe.directory="$PWD/js" -C js rev-parse HEAD
          sha256sum rust/.github/workflows/integration.yml \
            rust/.github/actions/archery-js-build/action.yml \
            ci/scripts/integration_arrow_build.sh \
            ci/docker/conda-integration.dockerfile
          node -p 'JSON.stringify(process.versions)'
          npm --version
          java -version 2>&1
          ldd --version
          conda list --explicit
          dpkg-query -W
          printf 'BUILD_DOCS_JS=%s\n' "$BUILD_DOCS_JS"
        } > "$RUNNER_TEMP/archery-js-inputs"
        echo "key=archery-js-v1-$(sha256sum "$RUNNER_TEMP/archery-js-inputs" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        BASH

    - name: Cache JavaScript integration dependencies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/archery-js.tar
        # Exact matches only: never accept an older source or build environment.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore JavaScript build
      if: steps.cache.outputs.cache-hit == 'true' && inputs.lookup-only != 'true'
      shell: bash
      run: |
        mkdir -p /build/js
        tar -xf "$RUNNER_TEMP/archery-js.tar" -C /build/js

    - name: Install JavaScript integration dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        conda run --no-capture-output bash -e <<'BASH'
        cd js
        # Archery runs bin/*.ts against src through SWC, without package distributions.
        npm ci
        BASH
        mkdir -p /build
        cp -a js /build/js
        tar --exclude=.git -cf "$RUNNER_TEMP/archery-js.tar" -C /build/js .
