name: Prepare Archery Java build
description: Build the required Java modules or restore an identical successful build
inputs:
  lookup-only:
    description: Seed missing caches without downloading existing builds
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify Java build inputs
      id: inputs
      shell: bash
      run: |
        conda run --no-capture-output bash -euo pipefail <<'BASH'
        {
          git -C java rev-parse HEAD
          sha256sum rust/.github/workflows/integration.yml \
            rust/.github/actions/archery-java-build/action.yml \
            ci/scripts/integration_arrow_build.sh \
            ci/docker/conda-integration.dockerfile
          mvn --version
          cmake --version
          java -version 2>&1
          ldd --version
          conda list --explicit
          dpkg-query -W
          for variable in ARROW_HOME ARROW_BUILD_TESTS ARROW_JAVA_BUILD_TESTS \
            ARROW_USE_CCACHE ARROW_DATASET ARROW_GANDIVA ARROW_ORC \
            ARROW_JAVA_BUILD ARROW_JAVA_BUILD_DOCS ARROW_JAVA_JNI \
            ARROW_JAVA_SHADE_FLATBUFFERS ARROW_JAVA_SKIP_GIT_PLUGIN \
            JAVA_HOME JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS MAVEN_OPTS \
            CMAKE_BUILD_TYPE CMAKE_UNITY_BUILD CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS; do
            printf '%s=%s\n' "$variable" "${!variable-}"
          done
        } > "$RUNNER_TEMP/archery-java-inputs"
        echo "key=archery-java-v1-$(sha256sum "$RUNNER_TEMP/archery-java-inputs" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        BASH

    - name: Cache complete Java build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/archery-java.tar
        # Exact matches only: never accept an older source or build environment.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore Java build
      if: steps.cache.outputs.cache-hit == 'true' && inputs.lookup-only != 'true'
      shell: bash
      run: |
        mkdir -p /build/java
        tar -xf "$RUNNER_TEMP/archery-java.tar" -C /build/java

    - name: Build required Java modules
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARROW_JAVA_CDATA: ON
        JAVA_JNI_CMAKE_ARGS: -DARROW_JAVA_JNI_ENABLE_DEFAULT=OFF -DARROW_JAVA_JNI_ENABLE_C=ON
        # Keep dependency modules, test compilation, and test JARs.
        MAVEN_ARGS: -pl bom,tools,flight/flight-integration-tests,c -am
      run: |
        conda run --no-capture-output bash -e <<'BASH'
        java/ci/scripts/jni_build.sh "$PWD/java" "$ARROW_HOME" /build/java /tmp/dist/java
        java/ci/scripts/build.sh "$PWD/java" /build/java /tmp/dist/java
        BASH
        tar --exclude=.git -cf "$RUNNER_TEMP/archery-java.tar" -C /build/java .
