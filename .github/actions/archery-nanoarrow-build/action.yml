name: Prepare Archery nanoarrow build
description: Build the nanoarrow integration targets or restore an identical build
inputs:
  lookup-only:
    description: Seed missing caches without downloading existing builds
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify nanoarrow build inputs
      id: inputs
      shell: bash
      run: |
        conda run --no-capture-output bash -euo pipefail <<'BASH'
        {
          git -c safe.directory="$PWD/nanoarrow" -C nanoarrow rev-parse HEAD
          sha256sum rust/.github/workflows/integration.yml \
            rust/.github/actions/archery-nanoarrow-build/action.yml \
            ci/scripts/nanoarrow_build.sh \
            ci/docker/conda-integration.dockerfile
          cmake --version
          ${CC:-cc} --version
          ${CXX:-c++} --version
          ldd --version
          conda list --explicit
          dpkg-query -W
          for variable in ARCHERY_INTEGRATION_WITH_NANOARROW CMAKE_PREFIX_PATH \
            CC CXX CFLAGS CXXFLAGS CPPFLAGS LDFLAGS; do
            printf '%s=%s\n' "$variable" "${!variable-}"
          done
        } > "$RUNNER_TEMP/archery-nanoarrow-inputs"
        echo "key=archery-nanoarrow-v1-$(sha256sum "$RUNNER_TEMP/archery-nanoarrow-inputs" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        BASH

    - name: Cache nanoarrow build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/archery-nanoarrow.tar
        # Exact matches only: never accept an older source or build environment.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore nanoarrow build
      if: steps.cache.outputs.cache-hit == 'true' && inputs.lookup-only != 'true'
      shell: bash
      run: |
        mkdir -p /build/nanoarrow
        tar -xf "$RUNNER_TEMP/archery-nanoarrow.tar" -C /build/nanoarrow

    - name: Build nanoarrow integration targets
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # The official script runs a plain `cmake --build .`; use every core.
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        conda run --no-capture-output ci/scripts/nanoarrow_build.sh "$PWD" /build
        tar -cf "$RUNNER_TEMP/archery-nanoarrow.tar" -C /build/nanoarrow .
