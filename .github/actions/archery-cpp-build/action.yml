name: Prepare Archery C++ build
description: Build all enabled C++ targets or restore and install the same build
inputs:
  lookup-only:
    description: Seed missing caches without downloading existing builds
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify C++ build inputs
      id: inputs
      shell: bash
      run: |
        conda run --no-capture-output bash -euo pipefail <<'BASH'
        {
          git rev-parse HEAD
          sha256sum rust/.github/workflows/integration.yml \
            rust/.github/actions/archery-cpp-build/action.yml
          cmake --version
          ${CC:-cc} --version
          ${CXX:-c++} --version
          ldd --version
          conda list --explicit
          dpkg-query -W
          # Include every environment variable read by the official build script.
          variables=$({
            grep -oE '\$\{?[[:alpha:]_][[:alnum:]_]*' ci/scripts/cpp_build.sh | sed -E 's/^\$\{?//'
            printf '%s\n' CMAKE_PREFIX_PATH CMAKE_INCLUDE_PATH CMAKE_LIBRARY_PATH \
              CC CXX AR AS LD RANLIB CFLAGS CXXFLAGS CPPFLAGS LDFLAGS \
              LD_LIBRARY_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH PKG_CONFIG_PATH
          } | LC_ALL=C sort -u)
          for variable in $variables; do
            printf '%s=%s\n' "$variable" "${!variable-}"
          done
        } > "$RUNNER_TEMP/archery-cpp-inputs"
        echo "key=archery-cpp-v1-$(sha256sum "$RUNNER_TEMP/archery-cpp-inputs" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        BASH

    - name: Cache complete C++ build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/archery-cpp.tar
        # Exact matches only: never accept an older source or build environment.
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.key }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore and install C++ build
      if: steps.cache.outputs.cache-hit == 'true' && inputs.lookup-only != 'true'
      shell: bash
      run: |
        mkdir -p /build/cpp
        tar -xf "$RUNNER_TEMP/archery-cpp.tar" -C /build/cpp
        conda run --no-capture-output cmake --install /build/cpp
        if command -v ldconfig >/dev/null; then
          ldconfig "$ARROW_HOME/${CMAKE_INSTALL_LIBDIR:-lib}"
        fi

    - name: Build every enabled C++ target
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        conda run --no-capture-output ci/scripts/cpp_build.sh "$PWD" /build
        tar -cf "$RUNNER_TEMP/archery-cpp.tar" -C /build/cpp .
