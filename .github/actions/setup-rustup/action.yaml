name: Setup rustup
description: "Install rustup and the rust-toolchain.toml toolchain on runners without Rust, such as ubuntu-slim"
runs:
  using: "composite"
  steps:
    - name: Install rustup
      shell: bash
      run: |
        curl --proto '=https' --tlsv1.2 --retry 3 -sSf https://sh.rustup.rs \
          | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install toolchain
      shell: bash
      # Installs the toolchain and components listed in rust-toolchain.toml.
      run: rustup toolchain install
