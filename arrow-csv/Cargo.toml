[package]
name = "arrow-csv"
version = { workspace = true }
description = "Support for parsing CSV format to and from the Arrow format"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_csv"
bench = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
csv = { version = "1.1", default-features = false }
csv-core = { version = "0.1" }
regex = { version = "1.7.0", default-features = false, features = ["std", "unicode", "perf"] }

[dev-dependencies]
# Enable `chrono-tz` so that tests can exercise IANA (named) timezones such as
# `America/New_York`, which is where DST transitions can be observed.
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-buffer = { workspace = true }
tempfile = "3.3"
futures = "0.3"
tokio = { version = "1.27", default-features = false, features = ["io-util"] }
bytes = "1.4"
half = { version = "2.1", default-features = false }

[lints]
workspace = true
