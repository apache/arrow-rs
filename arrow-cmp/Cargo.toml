[package]
name = "arrow-cmp"
version = { workspace = true }
description = "Basic comparator/ordering building blocks for Apache Arrow, shared by crates that need slot-wise comparison without pulling in the full arrow-ord kernels"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_cmp"
bench = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }

[dev-dependencies]
half = { version = "2.1", default-features = false, features = ["num-traits"] }
criterion = { workspace = true }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }

[[bench]]
name = "dict_cmp"
harness = false

[lints]
workspace = true
