[header]
builtin = "Apache-2.0-ASF"

[files]
excludes = [
  # License and attribution texts do not need source-file headers.
  "**/LICENSE*",
  "**/NOTICE*",
  # Git metadata and generated dependency/submodule commit lists.
  ".gitattributes",
  "**/.gitignore",
  ".gitmodules",
  ".gitmodules-commits",
  "**/Cargo.lock",
  # Test fixtures and expected output must retain their data formats.
  "arrow-avro/test/data/*.avro",
  "arrow-avro/test/data/*.avro.gz",
  "arrow-csv/test/data/**/*.csv",
  "arrow-json/test/data/*.json",
  "arrow-json/test/data/*.json.gz",
  "arrow-integration-test/data/*.json",
  "parquet/tests/arrow_reader/*.bin",
  "parquet/tests/arrow_reader/*.parquet",
  "parquet/src/bin/parquet-fromcsv-help.txt",
  # PEM certificates and private keys used by the Flight examples.
  "arrow-flight/examples/data/*.pem",
  "arrow-flight/examples/data/*.key",
  # Preserve upstream ASF header formatting in files copied from apache/arrow.
  "format/Flight.proto",
  "format/FlightSql.proto",
  "format/README.rst",
  # Derived from the MIT-licensed chronoutil crate; retain its MIT notice.
  "arrow-array/src/delta.rs",
  # Generated by prost-build from ASF-licensed format/Flight.proto and
  # format/FlightSql.proto; the generated files have no ASF header.
  "arrow-flight/src/arrow.flight.protocol.rs",
  "arrow-flight/src/sql/arrow.flight.protocol.sql.rs",
  # These Markdown, TOML, and shell files have no ASF header.
  ".config/nextest.toml",
  ".github/pull_request_template.md",
  # Preserve the existing header state of GitHub templates and configuration.
  ".github/ISSUE_TEMPLATE/bug_report.yml",
  ".github/ISSUE_TEMPLATE/config.yml",
  ".github/ISSUE_TEMPLATE/feature_request.yml",
  ".github/dependabot.yml",
  # Follow DataFusion in omitting ASF headers from agent guidance files.
  "AGENTS.md",
  "CLAUDE.md",
  "arrow-flight/examples/data/gen_certs.sh",
  # Config file only for release process
  "cliff.toml",
]

[styles.markdown_asf]
kind = "block"
start = "<!---"
prefix = "  "
end = "-->"

[[rules]]
extensions = ["md"]
style_out = "markdown_asf"

# Preserve the line-comment headers in JavaScript and FlatBuffers schemas.
[[rules]]
extensions = ["cjs", "fbs"]
style_out = "doubleslash"

[[rules]]
filenames = ["requirements.in", "requirements.txt"]
style_out = "script"
