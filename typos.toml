[default.extend-words]
# String values in tests that are the subject of the test and cannot be renamed
ba = "ba"       # sort/comparison test data e.g. vec!["ab", "ba", ...]
fo = "fo"       # rank test data e.g. vec!["foo", "fo", ...]
tru = "tru"     # partial boolean match arm: "t" | "tr" | "tru" | "true"
fals = "fals"   # partial boolean match arm: "f" | "fa" | "fal" | "fals" | "false"
Ue = "Ue"       # extracted from mixed-case test input "trUe"
Arro = "Arro"   # extracted from LIKE test input "ArroW"
Byt = "Byt"     # sort ordering test strings e.g. b"than12Byt", "LongerThan12Byt"
hel = "hel"     # substring test data e.g. vec![Some("hel"), ...]
mis = "mis"     # used in comment "mis-identifying" in parquet_derive

# flate2 is the crate name for the deflate/inflate compression library
flate = "flate"

[files]
extend-exclude = [
    "*.lock",
    "*.csv",
    "*.parquet",
    "*.avro",
    # Git submodules with upstream test data we don't control
    "parquet-testing/",
    "testing/",
    # Generated code from flatbuffers / protobuf
    "arrow-ipc/src/gen/",
    "arrow-flight/gen/",
    "arrow-flight/src/sql/arrow.flight.protocol.sql.rs",
    # Arrow format spec files with spec-defined identifiers
    "format/",
    # Binary test fixtures
    "arrow-avro/test/",
    # Benchmarks reference external dataset column names verbatim
    "parquet/benches/",
    # Historical changelogs contain PR titles we don't own
    "CHANGELOG.md",
    "CHANGELOG-old.md",
]
