[package]
name = "arrow-json"
version = { workspace = true }
description = "Support for parsing JSON format to and from the Arrow format"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_json"
bench = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-cast = { workspace = true }
arrow-ord = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
half = { version = "2.1", default-features = false }
indexmap = { version = "2.0", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
serde_core = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { workspace = true }
lexical-core = { version = "1.0", default-features = false}
memchr = "2.7.4"
simdutf8 = { workspace = true }
ryu = "1.0"
itoa = "1.0"

[dev-dependencies]
# Enable `chrono-tz` so that tests can exercise IANA (named) timezones such as
# `America/New_York`, which is where DST transitions can be observed.
arrow-array = { workspace = true, features = ["chrono-tz"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
futures = "0.3"
tokio = { version = "1.27", default-features = false, features = ["io-util"] }
bytes = "1.4"
criterion = { workspace = true, default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
arbitrary = { version = "1.4.2", features = ["derive"] }

[[bench]]
name = "serde"
harness = false

[[bench]]
name = "json_reader"
harness = false

[[bench]]
name = "json_writer"
harness = false

[lints]
workspace = true
