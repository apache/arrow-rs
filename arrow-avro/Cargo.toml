[package]
name = "arrow-avro"
version = { workspace = true }
description = "Support for parsing Avro format into the Arrow format"
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_avro"
bench = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["deflate", "snappy", "zstd", "bzip2", "xz"]
deflate = ["flate2"]
snappy = ["snap", "crc"]
canonical_extension_types = ["arrow-schema/canonical_extension_types"]
md5 = ["dep:md5"]
sha256 = ["dep:sha2"]
small_decimals = []
avro_custom_types = ["dep:arrow-select"]

# Enable async APIs
async = ["futures", "tokio"]
# Enable integration with object_store 0.13
#
# Deprecated: prefer `object_store_0_14`, this will be removed in a future major release
object_store = ["dep:object_store_0_13", "async"]
# Enable integration with object_store 0.14
object_store_0_14 = ["dep:object_store_0_14", "async"]

[dependencies]
arrow-schema = { workspace = true }
arrow-buffer = { workspace = true }
arrow-array = { workspace = true }
arrow-select = { workspace = true, optional = true }

# Each supported object_store version is a separately renamed dependency, gated behind a
# versioned feature flag. This allows adding support for new object_store releases, which
# are themselves breaking changes, without a breaking change to this crate
object_store_0_13 = { package = "object_store", version = "0.13.2", default-features = false, optional = true }
object_store_0_14 = { package = "object_store", version = "0.14.1", default-features = false, optional = true }

bytes = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde = { version = "1.0.188", features = ["derive"] }
flate2 = { version = "1.0", default-features = false, features = [
    "rust_backend",
], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
snap = { version = "1.0", default-features = false, optional = true }
zstd = { version = "0.13", default-features = false, optional = true }
bzip2 = { version = "0.6.0", optional = true }
xz = { package = "liblzma", version = "0.4", default-features = false, optional = true }
crc = { version = "3.0", optional = true }
strum_macros = "0.28"
uuid = "1.17"
indexmap = "2.10"
rand = "0.9"
md5 = { version = "0.8", optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1.0", optional = true, default-features = false, features = ["macros", "rt", "io-util"] }

[dev-dependencies]
arrow-data = { workspace = true }
bytes = { version = "1.11.0", default-features = false, features = ["std"] }
rand = { version = "0.9.1", default-features = false, features = [
    "std",
    "std_rng",
    "thread_rng",
] }
criterion = { workspace = true, default-features = false }
tempfile = "3.3"
arrow = { workspace = true, features = ["prettyprint"] }
futures = "0.3.31"
async-stream = "0.3.6"
apache-avro = "0.21.0"
num-bigint = "0.5"
# Enable the store implementations used by tests for every supported object_store version.
# Only the version selected by the enabled feature flag is used, tests access it via the
# `arrow_avro::object_store` re-export rather than by name
object_store_0_13 = { package = "object_store", version = "0.13.2", features = ["fs"] }
object_store_0_14 = { package = "object_store", version = "0.14.1", features = ["fs"] }
once_cell = "1.21.3"
half = { version = "2.1", default-features = false }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "io-util", "fs"] }

[[bench]]
name = "avro_reader"
harness = false

[[bench]]
name = "decoder"
harness = false

[[bench]]
name = "avro_writer"
harness = false

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "project_record"
harness = false
