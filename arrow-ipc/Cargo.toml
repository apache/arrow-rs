[package]
name = "arrow-ipc"
version = { workspace = true }
description = "Support for the Arrow IPC format"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_ipc"
bench = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true}
bytes = "1.4"
flatbuffers = { version = "25.2.10", default-features = false }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"], optional = true }
zstd = { version = "0.14.3", default-features = false, optional = true }

[features]
default = []
lz4 = ["lz4_flex"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3.3"
# used in benches
memmap2 = "0.9.3"
bytes = "1.9"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "io-util"] }

[[bench]]
name = "ipc_writer"
harness = false

[[bench]]
name = "ipc_reader"
harness = false

[lints]
workspace = true
