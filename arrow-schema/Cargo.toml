[package]
name = "arrow-schema"
version = { workspace = true }
description = "Defines the logical types for arrow arrays"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_schema"
bench = false

[dependencies]
serde_core = { version = "1.0", default-features = false, features = [
    "std",
    "rc",
], optional = true }
serde = { version = "1.0", default-features = false, features = [
    "derive",
], optional = true }
bitflags = { version = "2.0.0", default-features = false, optional = true }
serde_json = { version = "1.0", optional = true }

[features]
canonical_extension_types = ["dep:serde_core", "dep:serde_json"]
# Enable ffi support
ffi = ["bitflags"]
serde = ["dep:serde_core", "dep:serde"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = { workspace = true, default-features = false }
insta = { workspace = true, default-features = true }
postcard = { version = "1.0.10", default-features = false, features = ["use-std"] }
serde_json = "1.0"

[[bench]]
name = "ffi"
harness = false
required-features = ["ffi"]

[lints]
workspace = true
