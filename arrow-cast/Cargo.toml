[package]
name = "arrow-cast"
version = { workspace = true }
description = "Cast kernel and utilities for Apache Arrow"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_cast"
bench = false

[package.metadata.docs.rs]
all-features = true

[package.metadata.codspeed.benches]
# Skipped on CodSpeed (read by .github/workflows/codspeed-matrix.sh):
# currently fails at runtime. Fix the bench and remove this entry.
parse_date = { skip = true }

[features]
prettyprint = ["comfy-table"]

[dependencies]
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-data = { workspace = true }
arrow-ord = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
chrono = { workspace = true }
half = { version = "2.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
lexical-core = { version = "1.0", default-features = false, features = ["write-integers", "write-floats", "parse-integers", "parse-floats"] }
atoi = "3.1.1"
comfy-table = { version = "8", optional = true, default-features = false }
base64 = "0.23"
ryu = "1.0.16"

[dev-dependencies]
# Enable `chrono-tz` so that tests can exercise IANA (named) timezones such as
# `America/New_York`, which is where DST transitions can be observed.
arrow-array = { workspace = true, features = ["chrono-tz"] }
criterion = { workspace = true, default-features = false }
half = { version = "2.1", default-features = false }
insta = { workspace = true }
num-bigint = { version = "0.5", default-features = false, features = ["std"] }
rand = "0.10"

[[test]]
name = "cast"
path = "./tests/cast/mod.rs"

[[bench]]
name = "parse_timestamp"
harness = false

[[bench]]
name = "parse_time"
harness = false

[[bench]]
name = "parse_date"
harness = false

[[bench]]
name = "parse_decimal"
harness = false

[[bench]]
name = "format_temporal"
harness = false

[[bench]]
name = "cast_timestamp"
harness = false

[lints]
workspace = true

[[bench]]
name = "format_decimal"
harness = false

[[bench]]
name = "cast_decimal"
harness = false

[[bench]]
name = "format_boolean"
harness = false
