[package]
name = "arrow-buffer"
version = { workspace = true }
description = "Buffer abstractions for Apache Arrow"
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
include = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "arrow_buffer"
bench = false

[package.metadata.docs.rs]
all-features = true

[features]
# Enable memory tracking support
pool = []

[dependencies]
bytes = { version = "1.4" }
num-bigint = { version = "0.5.0", default-features = false, features = ["std"] }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
half = { version = "2.1", default-features = false }

[dev-dependencies]
criterion = { workspace = true, default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }

[[bench]]
name = "bit_mask"
harness = false

[[bench]]
name = "divisor"
harness = false

[[bench]]
name = "i256"
harness = false

[[bench]]
name = "offset"
harness = false

[[bench]]
name = "mutable_buffer_repeat_slice"
harness = false

[[bench]]
name = "mutable_buffer_extend"
harness = false

[[bench]]
name = "null_buffer_builder"
harness = false

[lints]
workspace = true
