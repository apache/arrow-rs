[package]
name = "parquet-variant"
version = { workspace = true }
license = { workspace = true }
description = "Apache Parquet Variant implementation in Rust"
repository = { workspace = true }
authors = { workspace = true }
keywords = ["arrow", "parquet", "variant"]
readme = "README.md"
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
arrow-schema = { workspace = true, features = ["canonical_extension_types"] }
chrono = { workspace = true }
half = { version = "2.1", default-features = false }
indexmap = "2.10.0"
uuid = { version = "1.18.0", features = ["v4"] }
simdutf8 = { workspace = true, optional = true }

# uuid requires the `js` feature to run on wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.18.0", features = ["v4", "js"] }

[lib]
name = "parquet_variant"
bench = false

[dev-dependencies]
proptest = { version = "1.0", default-features = false, features = ["std"] }
criterion = { workspace = true, default-features = false }
rand = { version = "0.10", default-features = false, features = [
    "std",
    "std_rng",
    "thread_rng",
] }

[features]
default = ["simdutf8"]
# Enable SIMD UTF-8 validation
simdutf8 = ["dep:simdutf8"]

[[bench]]
name = "variant_builder"
harness = false

[[bench]]
name = "variant_validation"
harness = false

[[bench]]
name = "variant_path"
harness = false

[lints]
workspace = true
